$kind: http-request
description: Example call from the exercise. Checks status, JSON content type, response structure and the main fields of each item. Saves the first volume id for GB-08.
url: "{{baseUrl}}/volumes?q=ios&maxResults=20&startIndex=0&key={{apiKey}}"
method: GET
headers:
  Accept: application/json
queryParams:
  q: ios
  maxResults: "20"
  startIndex: "0"
  key: "{{apiKey}}"
scripts:
  - type: afterResponse
    code: |-
      // ===== GB-01: happy path with the example call from the exercise (q=ios, 20 results) =====
      // 1) HTTP level
      pm.test('Status is 200', () => pm.response.to.have.status(200));          // 200 = OK
      pm.test('Response is JSON', () => {
        pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json');
      });

      // 2) Body level: convert the JSON text into an object called `body`
      const body = pm.response.json();
      pm.test('Top-level structure is correct', () => {
        pm.expect(body.kind).to.eql('books#volumes');                    // Google's label for a list of books
        pm.expect(body).to.have.property('totalItems');                  // total number of matches exists
        pm.expect(body.totalItems).to.be.a('number').and.to.be.above(0); // it is a number greater than 0
        pm.expect(body.items).to.be.an('array').that.is.not.empty;       // `items` is a non-empty list
      });
      pm.test('Respects maxResults (<= 20)', () => {
        pm.expect(body.items.length).to.be.at.most(20);                  // never more than the 20 requested
      });
      pm.test('Every item has kind, id and volumeInfo.title', () => {
        // forEach = repeat the same checks for each book in the list (item = the current book)
        body.items.forEach(item => {
          pm.expect(item.kind).to.eql('books#volume');                   // a single book's label
          pm.expect(item).to.have.property('id');                        // unique id
          pm.expect(item.volumeInfo).to.have.property('title');          // title lives inside volumeInfo
        });
      });
      pm.test('Item ids are unique', () => {
        const ids = body.items.map(i => i.id);                           // list with just the ids
        pm.expect(new Set(ids).size).to.eql(ids.length);                 // a Set drops duplicates: same size = no duplicates
      });

      // 3) Save the first book's id in a COLLECTION VARIABLE so that GB-08 can reuse it ("chaining" requests).
      //    That is why GB-01 must run before GB-08.
      pm.collectionVariables.set('volumeId', body.items[0].id);
    language: text/javascript
order: 1000
