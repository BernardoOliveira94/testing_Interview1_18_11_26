$kind: http-request
description: maxResults=5 must return at most 5 items.
url: "{{baseUrl}}/volumes?q=javascript&maxResults=5&key={{apiKey}}"
method: GET
headers:
  Accept: application/json
queryParams:
  q: javascript
  maxResults: "5"
  key: "{{apiKey}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test('At most 5 items returned', () => {
        pm.expect(body.items).to.be.an('array');
        pm.expect(body.items.length).to.be.at.most(5);
      });
    language: text/javascript
order: 2000
